</text> <rect x="495" y="242" width="385" height="88" rx="14" fill="#8c0000" opacity="0.93"/> <path d="M 866,330 L 892,346 L 852,330 Z" fill="#8c0000" opacity="0.93"/> <text font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"> <tspan x="511" y="262" fill="#ffffff" font-size="11.5" font-weight="600">UAM вЂ” Universal Access Management</tspan> <tspan x="511" y="277" fill="#ffcccc" font-size="11" font-weight="300">4As: Administration В· Authentication</tspan> <tspan x="511" y="291" fill="#ffcccc" font-size="11" font-weight="300"> Authorization В· Audit</tspan> <tspan x="511" y="305" fill="#ffcccc" font-size="11" font-weight="300">RBAC вЂ” Role-Based Access Control</tspan> </text> <rect x="240" y="342" width="420" height="80" rx="14" fill="#7a0000" opacity="0.93"/> <path d="M 450,422 L 440,440 L 462,422 Z" fill="#7a0000" opacity="0.93"/> <text font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"> <tspan x="256" y="362" fill="#ffffff" font-size="12" font-weight="600">Modular Monolith</tspan> <tspan x="256" y="378" fill="#ffcccc" font-size="11" font-weight="300">Single codebase structured into independent,</tspan> <tspan x="256" y="394" fill="#ffcccc" font-size="11" font-weight="300">loosely coupled business modules.</tspan> </text></svg>