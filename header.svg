<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="450" viewBox="0 0 900 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#061433"/>
      <stop offset="100%" stop-color="#0c2d72"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#2f6fe0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2f6fe0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="petalBlue" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#3f63d8"/>
      <stop offset="100%" stop-color="#a9c2ff"/>
    </linearGradient>
    <linearGradient id="petalWhite" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#b9cdf7"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="titleshadow" x="-10%" y="-10%" width="120%" height="260%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur"/>
      <feOffset in="blur" dx="0" dy="16" result="offsetblur"/>
      <feFlood flood-color="#020a1f" flood-opacity="0.60" result="color"/>
      <feComposite in="color" in2="offsetblur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="spiderglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0.8 0 0 0 0.2  0 0.9 0 0 0.3  0 0 1 0 0.6  0 0 0 2.2 0" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
